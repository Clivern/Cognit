<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cognit — A Service Discovery Registry for AI Agents</title>
  <meta name="description" content="Cognit is a Service Discovery Registry for AI Agents. Agents register, discover each other by skill, and call through a gateway that manages load balancing, health, and policy on every request." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <meta name="theme-color" content="#37352f" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f6f3;
      --ink: #37352f;
      --ink-soft: #6b6966;
      --cyan: #0e7490;
      --cyan-soft: #0891b2;
      --health: #059669;
      --amber: #d97706;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      font-family: "Sora", ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }


    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: var(--bg);
    }

    .orbit {
      position: absolute;
      inset: -6% -4%;
      opacity: 0.78;
      animation: drift 24s ease-in-out infinite;
    }

    .orbit svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .synapse {
      fill: none;
      stroke: rgba(55, 53, 47, 0.22);
      stroke-width: 1.2;
      stroke-linecap: round;
    }

    .synapse.soft {
      stroke: rgba(14, 116, 144, 0.28);
    }

    .synapse.cyan {
      stroke: rgba(14, 116, 144, 0.4);
    }

    .synapse.health {
      stroke: rgba(5, 150, 105, 0.38);
    }

    .synapse.faint {
      stroke: rgba(55, 53, 47, 0.12);
      stroke-width: 1;
    }

    .neuron {
      fill: #fff;
      stroke: rgba(55, 53, 47, 0.32);
      stroke-width: 1.2;
    }

    .neuron.input {
      fill: rgba(55, 53, 47, 0.88);
      stroke: none;
    }

    .neuron.output {
      fill: var(--cyan);
      stroke: none;
    }

    .neuron.active {
      fill: var(--ink);
      stroke: none;
    }

    .neuron.health {
      fill: var(--health);
      stroke: none;
    }

    .neuron.cyan {
      fill: var(--cyan);
      stroke: none;
    }

    .halo {
      fill: none;
      stroke: rgba(14, 116, 144, 0.35);
      stroke-width: 1;
      transform-origin: center;
      transform-box: fill-box;
      animation: pulse-ring 3.8s ease-out infinite;
    }

    .halo.health {
      stroke: rgba(5, 150, 105, 0.35);
      animation-delay: 1.3s;
    }

    .signal {
      fill: var(--ink);
      opacity: 0;
    }

    .signal.cyan { fill: var(--cyan); }
    .signal.health { fill: var(--health); }

    .veil {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 52% 46% at 38% 48%, rgba(247, 246, 243, 0.88) 0%, rgba(247, 246, 243, 0.62) 48%, rgba(247, 246, 243, 0.28) 74%, rgba(247, 246, 243, 0.08) 100%),
        linear-gradient(90deg, rgba(247, 246, 243, 0.55) 0%, rgba(247, 246, 243, 0.18) 52%, rgba(247, 246, 243, 0.28) 100%);
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: flex;
      align-items: center;
      width: min(720px, calc(100% - 2.5rem));
      margin: 0 auto;
      padding: 3rem 0 4.5rem;
    }

    .copy { max-width: 40rem; }

    .brand {
      display: block;
      margin: 0 0 1.5rem;
      width: clamp(5.5rem, 14vw, 8rem);
      height: auto;
    }

    h1 {
      margin: 0 0 1.85rem;
      max-width: 16ch;
      font-size: clamp(1.75rem, 4.2vw, 2.65rem);
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1.12;
    }

    .hero-gradient-text {
      background: linear-gradient(
        90deg,
        #37352f 0%,
        #0e7490 24%,
        #0891b2 40%,
        #14b8a6 52%,
        #0e7490 68%,
        #5b6775 86%,
        #37352f 100%
      );
      background-size: 400% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: hero-gradient-shift 11s ease-in-out infinite;
      overflow: visible;
      padding-bottom: 0.08em;
    }

    .lead {
      margin: 0 0 1rem;
      max-width: 36rem;
      color: var(--ink-soft);
      font-size: clamp(0.98rem, 1.6vw, 1.08rem);
      line-height: 1.55;
      font-weight: 400;
    }

    .lead + .btn { margin-top: 0.85rem; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      padding: 0 1.25rem;
      border-radius: 0.45rem;
      background: var(--ink);
      color: var(--bg);
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s var(--ease), transform 0.2s var(--ease);
    }

    .btn:hover {
      background: #2f2d29;
      transform: translateY(-1px);
    }

    .site-footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      display: flex;
      justify-content: center;
      padding: 0.85rem 1.25rem calc(0.85rem + env(safe-area-inset-bottom));
      pointer-events: none;
    }

    .site-footer a {
      pointer-events: auto;
      color: var(--ink-soft);
      font-size: 0.8rem;
      text-decoration: none;
      transition: color 0.2s var(--ease);
    }

    .site-footer a:hover { color: var(--ink); }

    @media (max-width: 720px) {
      .orbit { opacity: 0.58; }
      .veil {
        background:
          radial-gradient(ellipse 72% 58% at 40% 45%, rgba(247, 246, 243, 0.9) 0%, rgba(247, 246, 243, 0.72) 52%, rgba(247, 246, 243, 0.4) 78%, rgba(247, 246, 243, 0.16) 100%);
      }
      .site-footer { position: static; }
      .page { padding-bottom: 2rem; }
    }

    @keyframes drift {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-1.2%, -1%, 0) scale(1.02); }
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.85); opacity: 0.65; }
      70% { transform: scale(1.6); opacity: 0; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    @keyframes hero-gradient-shift {
      0%, 100% { background-position: 0% center; }
      50% { background-position: 100% center; }
    }
  </style>
</head>
