openapi: 3.0.3
info:
  title: Cognit API
  description: |
    HTTP API for the Cognit workspace control plane (agents, instances, policy, and workspace administration).

    **Authentication** (except public routes): session cookie `_cognit_session`, `X-API-Key` (user API key), or `X-Access-Key` (workspace access key).
    Workspace-scoped routes require membership (session) or an access key for that workspace.

    This document reflects routes registered in `core/server.go`. Planned A2A gateway and catalog paths described in `docs/api.md` are not included until implemented.
  version: 1.0.0
  license:
    name: Proprietary

servers:
  - url: /
    description: App origin (configure `app.url`)

tags:
  - name: Public
  - name: Session
  - name: Profile
  - name: Settings
  - name: API keys
  - name: Workspaces
  - name: Invites
  - name: Members
  - name: Access keys
  - name: Billing
  - name: Audits
  - name: Agents
  - name: Instances
  - name: Intentions
  - name: Key-value
  - name: Traffic
  - name: Metrics

security:
  - sessionCookie: []
  - userApiKey: []
  - workspaceAccessKey: []

paths:
  /api/v1/public/_health:
    get:
      tags: [Public]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/public/_ready:
    get:
      tags: [Public]
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Dependencies healthy
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/public/action/setup:
    post:
      tags: [Public]
      summary: Initial platform setup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: Setup completed
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/public/action/setup/status:
    get:
      tags: [Public]
      summary: Setup completion status
      security: []
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  installed:
                    type: boolean

  /api/v1/public/action/logout:
    post:
      tags: [Public]
      summary: Clear session cookie
      security: []
      responses:
        "200":
          description: Logged out

  /api/v1/public/action/oauth/github:
    get:
      tags: [Public]
      summary: Start GitHub OAuth
      security: []
      responses:
        "302":
          description: Redirect to GitHub

  /api/v1/public/action/oauth/github/callback:
    get:
      tags: [Public]
      summary: GitHub OAuth callback
      security: []
      responses:
        "302":
          description: Redirect to app with session cookie set

  /api/v1/public/action/oauth/google:
    get:
      tags: [Public]
      summary: Start Google OAuth
      security: []
      responses:
        "302":
          description: Redirect to Google

  /api/v1/public/action/oauth/google/callback:
    get:
      tags: [Public]
      summary: Google OAuth callback
      security: []
      responses:
        "302":
          description: Redirect to app with session cookie set

  /api/v1/public/action/stripe/webhook:
    post:
      tags: [Billing]
      summary: Stripe webhook (SaaS edition only)
      security: []
      description: Registered only when the app runs in SaaS mode.
      responses:
        "200":
          description: Accepted

  /api/v1/public/_metrics:
    get:
      tags: [Metrics]
      summary: Prometheus metrics
      security:
        - metricsBasicAuth: []
      responses:
        "200":
          description: Prometheus text exposition format

  /api/v1/me:
    get:
      tags: [Session]
      summary: Current API key or access key principal
      description: Requires `X-API-Key` or `X-Access-Key`; session cookies are not accepted.
      security:
        - userApiKey: []
        - workspaceAccessKey: []
      responses:
        "200":
          description: Key metadata
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MeAPIKey"
                  - $ref: "#/components/schemas/MeAccessKey"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/action/profile:
    get:
      tags: [Profile]
      summary: Get user profile
      responses:
        "200":
          description: Profile
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Profile]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/action/settings:
    get:
      tags: [Settings]
      summary: Get app settings (admin)
      responses:
        "200":
          description: Settings
    put:
      tags: [Settings]
      summary: Update app settings (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Updated

  /api/v1/apiKeys:
    post:
      tags: [API keys]
      summary: Create user API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
      responses:
        "201":
          description: Created (includes secret once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKey"
    get:
      tags: [API keys]
      summary: List user API keys
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKeys:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIKey"
                  _meta:
                    $ref: "#/components/schemas/PaginationMeta"

  /api/v1/apiKeys/{apiKeyId}:
    get:
      tags: [API keys]
      summary: Get user API key
      parameters:
        - $ref: "#/components/parameters/apiKeyId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKey"
    delete:
      tags: [API keys]
      summary: Delete user API key
      parameters:
        - $ref: "#/components/parameters/apiKeyId"
      responses:
        "204":
          description: Deleted

  /api/v1/workspaces:
    post:
      tags: [Workspaces]
      summary: Create workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
    get:
      tags: [Workspaces]
      summary: List workspaces for current user
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaces:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workspace"
                  _meta:
                    $ref: "#/components/schemas/PaginationMeta"

  /api/v1/workspaces/{workspaceId}:
    get:
      tags: [Workspaces]
      summary: Get workspace
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
    put:
      tags: [Workspaces]
      summary: Update workspace
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspaceRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
    delete:
      tags: [Workspaces]
      summary: Delete workspace
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "204":
          description: Deleted

  /api/v1/workspaces/{workspaceId}/invites:
    post:
      tags: [Invites]
      summary: Create member invite
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
    get:
      tags: [Invites]
      summary: List invites
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  invites:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invite"
                  _meta:
                    $ref: "#/components/schemas/PaginationMeta"

  /api/v1/workspaces/{workspaceId}/invites/{inviteId}:
    get:
      tags: [Invites]
      summary: Get invite
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/inviteId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
    delete:
      tags: [Invites]
      summary: Revoke invite
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/inviteId"
      responses:
        "204":
          description: Revoked

  /api/v1/workspaces/{workspaceId}/members:
    get:
      tags: [Members]
      summary: List workspace members
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkspaceMember"
                  _meta:
                    $ref: "#/components/schemas/PaginationMeta"

  /api/v1/workspaces/{workspaceId}/members/{memberUserId}:
    put:
      tags: [Members]
      summary: Update member role
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/memberUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRoleRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
    delete:
      tags: [Members]
      summary: Remove member
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/memberUserId"
      responses:
        "204":
          description: Removed

  /api/v1/workspaces/{workspaceId}/keys:
    post:
      tags: [Access keys]
      summary: Create workspace access key
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccessKeyRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessKey"
    get:
      tags: [Access keys]
      summary: List workspace access keys
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccessKey"
                  _meta:
                    $ref: "#/components/schemas/PaginationMeta"

  /api/v1/workspaces/{workspaceId}/keys/{keyId}:
    get:
      tags: [Access keys]
      summary: Get access key
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/keyId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessKey"
    delete:
      tags: [Access keys]
      summary: Delete access key
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/keyId"
      responses:
        "204":
          description: Deleted

  /api/v1/workspaces/{workspaceId}/billing:
    get:
      tags: [Billing]
      summary: Billing status (SaaS only)
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatus"

  /api/v1/workspaces/{workspaceId}/billing/usage:
    get:
      tags: [Billing]
      summary: Billing usage (SaaS only)
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingUsage"

  /api/v1/workspaces/{workspaceId}/billing/checkout:
    post:
      tags: [Billing]
      summary: Start Stripe checkout (SaaS only)
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingCheckoutRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSession"

  /api/v1/workspaces/{workspaceId}/billing/portal:
    post:
      tags: [Billing]
      summary: Open Stripe customer portal (SaaS only)
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSession"

  /api/v1/workspaces/{workspaceId}/audits:
    get:
      tags: [Audits]
      summary: List audit events
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  audits:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
                  _meta:
                    $ref: "#/components/schemas/PaginationMeta"

  /api/v1/workspaces/{workspaceId}/audits/{auditId}:
    get:
      tags: [Audits]
      summary: Get audit event
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/auditId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEvent"

  /api/v1/workspaces/{workspaceId}/agents:
    get:
      tags: [Agents]
      summary: List agents
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/Agent"
                  _meta:
                    $ref: "#/components/schemas/PaginationMeta"

  /api/v1/workspaces/{workspaceId}/agents/{agentName}:
    put:
      tags: [Agents]
      summary: Register or replace agent card
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/agentName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertAgentRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
    get:
      tags: [Agents]
      summary: Get agent
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/agentName"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
    delete:
      tags: [Agents]
      summary: Delete agent
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/agentName"
      responses:
        "204":
          description: Deleted

  /api/v1/workspaces/{workspaceId}/agents/{agentName}/instances:
    get:
      tags: [Instances]
      summary: List agent instances
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/agentName"
        - name: passing
          in: query
          schema:
            type: boolean
          description: When true, return only instances with a live lease.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  instances:
                    type: array
                    items:
                      $ref: "#/components/schemas/Instance"

  /api/v1/workspaces/{workspaceId}/agents/{agentName}/instances/{instanceId}:
    get:
      tags: [Instances]
      summary: Get instance
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/agentName"
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
    put:
      tags: [Instances]
      summary: Register or update instance and start lease
      description: |
        Accepts workspace access keys (`X-Access-Key`) without a user session.
        The agent card must exist before registering an instance.
      security:
        - workspaceAccessKey: []
        - sessionCookie: []
        - userApiKey: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/agentName"
        - $ref: "#/components/parameters/instanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInstanceRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
    delete:
      tags: [Instances]
      summary: Deregister instance
      security:
        - workspaceAccessKey: []
        - sessionCookie: []
        - userApiKey: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/agentName"
        - $ref: "#/components/parameters/instanceId"
      responses:
        "204":
          description: Deleted

  /api/v1/workspaces/{workspaceId}/agents/{agentName}/instances/{instanceId}/renew:
    put:
      tags: [Instances]
      summary: Renew instance lease
      security:
        - workspaceAccessKey: []
        - sessionCookie: []
        - userApiKey: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/agentName"
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"

  /api/v1/workspaces/{workspaceId}/intentions:
    get:
      tags: [Intentions]
      summary: List intentions
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  intentions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Intention"
                  _meta:
                    $ref: "#/components/schemas/PaginationMeta"
    put:
      tags: [Intentions]
      summary: Create intention
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveIntentionRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intention"

  /api/v1/workspaces/{workspaceId}/intentions/check:
    post:
      tags: [Intentions]
      summary: Check whether a call is allowed
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckIntentionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckIntentionResponse"

  /api/v1/workspaces/{workspaceId}/intentions/{intentionId}:
    get:
      tags: [Intentions]
      summary: Get intention
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/intentionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intention"
    put:
      tags: [Intentions]
      summary: Update intention
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/intentionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveIntentionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intention"
    delete:
      tags: [Intentions]
      summary: Delete intention
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/intentionId"
      responses:
        "204":
          description: Deleted

  /api/v1/workspaces/{workspaceId}/kv:
    get:
      tags: [Key-value]
      summary: List workspace keys
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: string

  /api/v1/workspaces/{workspaceId}/kv/{key}:
    get:
      tags: [Key-value]
      summary: Get workspace key
      description: "The {key} path parameter may contain slashes; the server matches the remainder of the path after /kv/."
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/kvKey"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyValueItem"
    put:
      tags: [Key-value]
      summary: Write workspace key
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/kvKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutKeyValueRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyValueItem"
    delete:
      tags: [Key-value]
      summary: Delete workspace key
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/kvKey"
      responses:
        "204":
          description: Deleted

  /api/v1/workspaces/{workspaceId}/traffic:
    get:
      tags: [Traffic]
      summary: List gateway traffic records
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  traffic:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrafficCall"
                  _meta:
                    $ref: "#/components/schemas/PaginationMeta"

  /api/v1/workspaces/{workspaceId}/traffic/{trafficId}:
    get:
      tags: [Traffic]
      summary: Get traffic record
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/trafficId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrafficCall"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: _cognit_session
    userApiKey:
      type: apiKey
      in: header
      name: X-API-Key
    workspaceAccessKey:
      type: apiKey
      in: header
      name: X-Access-Key
    metricsBasicAuth:
      type: http
      scheme: basic

  parameters:
    workspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    agentName:
      name: agentName
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'
    instanceId:
      name: instanceId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'
    apiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    keyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    inviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    memberUserId:
      name: memberUserId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    auditId:
      name: auditId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    intentionId:
      name: intentionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    trafficId:
      name: trafficId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    kvKey:
      name: key
      in: path
      required: true
      schema:
        type: string
      description: Key path segment(s) after `/kv/`
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    BadRequest:
      description: Validation or bad input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [errorMessage]
      properties:
        errorMessage:
          type: string

    PaginationMeta:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
          format: int64

    SetupRequest:
      type: object
      required: [platformEmail]
      properties:
        platformEmail:
          type: string
          format: email

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 60

    UpdateSettingsRequest:
      type: object
      required: [platformEmail]
      properties:
        platformEmail:
          type: string
          format: email
        maintenanceMode:
          type: boolean

    CreateAPIKeyRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 60
        expiresAt:
          type: string
          format: date-time
          nullable: true

    APIKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key:
          type: string
          description: Returned only on create
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    MeAPIKey:
      type: object
      properties:
        type:
          type: string
          example: api_key
        id:
          type: string
          format: uuid
        name:
          type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true

    MeAccessKey:
      type: object
      properties:
        type:
          type: string
          example: access_key
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        name:
          type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true

    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 60

    UpdateWorkspaceRequest:
      $ref: "#/components/schemas/CreateWorkspaceRequest"

    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        handle:
          type: string
        count:
          type: integer
          format: int64
        role:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateInviteRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string

    Invite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    UpdateMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string

    WorkspaceMember:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string
        joinedAt:
          type: string
          format: date-time

    CreateAccessKeyRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 60
        expiresAt:
          type: string
          format: date-time
          nullable: true

    AccessKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key:
          type: string
          description: Returned only on create
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    BillingStatus:
      type: object
      additionalProperties: true

    BillingUsage:
      type: object
      additionalProperties: true

    BillingCheckoutRequest:
      type: object
      properties:
        plan:
          type: string

    BillingSession:
      type: object
      properties:
        url:
          type: string
          format: uri

    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        actor:
          type: string
        resource:
          type: string
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    UpsertAgentRequest:
      type: object
      required: [card]
      properties:
        card:
          type: object
          description: A2A Agent Card JSON object
          additionalProperties: true
        version:
          type: string
          maxLength: 40
          description: Optional; taken from card.version when omitted

    AgentInstanceSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        instanceId:
          type: string
        address:
          type: string
        port:
          type: integer
        datacenter:
          type: string
          nullable: true
        meta:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [passing, warning, critical]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: string
        card:
          type: object
          additionalProperties: true
        cardChecksum:
          type: string
        health:
          type: string
        instances:
          type: array
          items:
            $ref: "#/components/schemas/AgentInstanceSummary"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterInstanceRequest:
      type: object
      required: [address, port]
      properties:
        address:
          type: string
          maxLength: 255
        port:
          type: integer
          minimum: 1
          maximum: 65535
        datacenter:
          type: string
          maxLength: 60
        meta:
          type: object
          additionalProperties: true
        leaseTtl:
          type: integer
          minimum: 5
          maximum: 86400
          description: Lease length in seconds; default 30

    HealthCheck:
      type: object
      properties:
        checkId:
          type: string
        name:
          type: string
        type:
          type: string
        status:
          type: string
        output:
          type: string
          nullable: true
        ttlExpiresAt:
          type: string
          format: date-time
          nullable: true
        lastRunAt:
          type: string
          format: date-time
          nullable: true

    Instance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        instanceId:
          type: string
        address:
          type: string
        port:
          type: integer
        datacenter:
          type: string
          nullable: true
        meta:
          type: object
          additionalProperties: true
        status:
          type: string
        leaseExpiresAt:
          type: string
          format: date-time
          nullable: true
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    IntentionSource:
      type: object
      required: [agent]
      properties:
        agent:
          type: string
          maxLength: 100

    IntentionDestination:
      type: object
      required: [agent]
      properties:
        agent:
          type: string
          maxLength: 100
        skill:
          type: string
          maxLength: 120

    SaveIntentionRequest:
      type: object
      required: [source, destination, action]
      properties:
        source:
          $ref: "#/components/schemas/IntentionSource"
        destination:
          $ref: "#/components/schemas/IntentionDestination"
        action:
          type: string
          enum: [allow, deny]

    CheckIntentionRequest:
      type: object
      required: [source, destination]
      properties:
        source:
          $ref: "#/components/schemas/IntentionSource"
        destination:
          $ref: "#/components/schemas/IntentionDestination"

    Intention:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        source:
          type: string
        destination:
          type: string
        skill:
          type: string
        action:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CheckIntentionResponse:
      type: object
      properties:
        action:
          type: string
        intention:
          $ref: "#/components/schemas/Intention"

    PutKeyValueRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string

    KeyValueItem:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TrafficCall:
      type: object
      properties:
        id:
          type: string
          format: uuid
        verb:
          type: string
        sourceAgent:
          type: string
        destinationAgent:
          type: string
        skill:
          type: string
        result:
          type: string
        createdAt:
          type: string
          format: date-time
